<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 10px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .hint { color: #666; font-size: 11px; margin-bottom: 8px; }
    textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 11px; }
    .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
    button { cursor: pointer; padding: 4px 10px; }
    #start { background: #c00; color: #fff; border: none; border-radius: 4px; }
    #stop { background: #e8a000; color: #fff; border: none; border-radius: 4px; }
    pre { background: #111; color: #6f6; padding: 6px; height: 120px; overflow: auto;
          font-size: 11px; white-space: pre-wrap; border-radius: 4px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>YT Liker</h1>
  <div class="hint">
    Likes videos on YOUR account via your logged-in tab. Open a youtube.com tab first.
    Bulk liking can trip spam limits — keep the delay sane.
  </div>

  <textarea id="ids" rows="6" placeholder="one 11-char video id per line"></textarea>

  <div class="row">
    <button id="load">Load from app</button>
    <span style="flex:1"></span>
    <label>delay <input id="delay" type="number" value="4" min="2" step="1" style="width:46px"> s</label>
  </div>
  <div class="row">
    <button id="start">Like all</button>
    <button id="stop">Stop</button>
  </div>

  <pre id="log"></pre>
  <script src="popup.js"></script>
</body>
</html>
