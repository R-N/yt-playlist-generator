name: Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Signing secrets live in this Environment, so no other workflow can read them.
    environment: android-release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Select and validate release version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$MANUAL_VERSION"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Version must be MAJOR.MINOR.PATCH.' >&2; exit 1; }
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          (( major <= 2099 && minor <= 999 && patch <= 999 ))
          code=$((major * 1000000 + minor * 1000 + patch))
          (( code > 0 && code <= 2100000000 ))
          # Every prior release tag must be lower, so an installed APK can always
          # be replaced by a later one.
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
            prior=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
            (( prior < code )) || { printf 'Version %s is not greater than tag %s\n' "$version" "$tag" >&2; exit 1; }
          done < <(git tag --list 'v*')
          {
            printf 'ANDROID_VERSION_CODE=%s\n' "$code"
            printf 'ANDROID_VERSION_NAME=%s\n' "$version"
          } >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: review_app/frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install and build web assets
        working-directory: review_app/frontend
        run: npm ci && npm run build
      - name: Sync Capacitor Android project
        working-directory: review_app/frontend
        run: npx cap add android && npx cap sync android
      - name: Prepare Android project
        working-directory: review_app/frontend
        run: npm run android:prepare
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yt-playlist-generator-release.jks"
          chmod 600 "$RUNNER_TEMP/yt-playlist-generator-release.jks"
      - name: Assemble release APK
        working-directory: review_app/frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yt-playlist-generator-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release certificate
        working-directory: review_app/frontend/android
        run: |
          set -euo pipefail
          test -s ../release-cert-sha256.txt || { echo 'Missing release certificate fingerprint pin.' >&2; exit 1; }
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK not installed}}"
          build_tools="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$build_tools"
          "$build_tools" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apksigner-certs.txt" 2>&1
          expected="$(tr -d ':[:space:]\r\n' < ../release-cert-sha256.txt | tr '[:lower:]' '[:upper:]')"
          actual="$(awk 'index($0, "SHA-256 digest:") { sub(/^.*SHA-256 digest:[[:space:]]*/, ""); print; exit }' "$RUNNER_TEMP/apksigner-certs.txt" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]]
          [[ "$actual" == "$expected" ]] || { printf 'Certificate fingerprint mismatch: expected %s, APK %s\n' "$expected" "$actual" >&2; exit 1; }
      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-apk-${{ inputs.version }}
          if-no-files-found: error
          path: review_app/frontend/android/app/build/outputs/apk/release/app-release.apk
